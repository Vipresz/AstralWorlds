# Camera System Editor - UI Default Configuration
# ================================================
# This file contains all default values for the Camera System Editor UI.
# Values are loaded at application launch and can be reloaded via the "Reset to Config" button.
# 
# Note: If any default value exceeds the slider limits, it will be clamped to the valid range.

# ============================================================================
# Camera Movement Constants
# ============================================================================
[camera]
movement_speed = 150.0
yaw = -90.0
pitch = 0.0

# ============================================================================
# Grid Constants
# ============================================================================
[grid]
world_spacing = 50.0
cell_count = 20
visible = false

# ============================================================================
# Camera Controls - Toggles
# ============================================================================
[camera_controls]
loop_enabled = false
capture_enabled = false
tof_data_enabled = true
vipres_enabled = true
vipres_free_camera_object_enabled = false

# ============================================================================
# TOF Controls - Toggles
# ============================================================================
[tof]
extract_color_enabled = false
render_color_mode = 0  # 0=BaseColor, 1=ColorByCamera, 2=ColorByObject
gridding_enabled = true
low_pass_enabled = false
tsdf_enabled = false
tsdf_store_color = false
noisy_tof_enabled = false

# TOF Controls - Sliders
sampling_density = 20
depth_limit = 100000.0
sampling_rate = 20.0
grid_size = 1.5
grid_mode = 0  # 0=Average, 1=FirstCome, 2=GridValue
tsdf_truncation_distance = 3.0
tsdf_weight_decay = 0.95
low_pass_cutoff = 10.0
noise_amount = 1.0

# TOF Slider Limits
[tof.limits]
sampling_density_min = 1
sampling_density_max = 25
depth_limit_min = 0.001
depth_limit_max = 100000.0
sampling_rate_min = 1.0
sampling_rate_max = 60.0
grid_size_min = 0.1
grid_size_max = 10.0
tsdf_truncation_distance_min = 0.5
tsdf_truncation_distance_max = 10.0
tsdf_weight_decay_min = 0.0
tsdf_weight_decay_max = 1.0
low_pass_cutoff_min = 0.0
low_pass_cutoff_max = 30.0
noise_amount_min = 0.1
noise_amount_max = 10.0

# ============================================================================
# Smart Occupancy Algorithm Settings
# ============================================================================
[occupancy]
enabled = false
neighbor_consistency = false
persistence = false
variance = false
eviction = false
eviction2 = false

# Smart Occupancy - Slider defaults
neighbor_radius = 2.0
residual_threshold = 1.0
persistence_gamma = 3.0
variance_threshold = 1.0
eviction_decay = 0.5
eviction_increment = 0.5
eviction_min_start_value = 0.1
eviction2_appearance_threshold = 3
eviction2_removal_threshold = 5
weight_threshold = 0.0

# Smart Occupancy - Slider limits
[occupancy.limits]
neighbor_radius_min = 1.0
neighbor_radius_max = 5.0
neighbor_radius_step = 0.1
residual_threshold_min = 0.1
residual_threshold_max = 5.0
residual_threshold_step = 0.1
persistence_gamma_min = 1.0
persistence_gamma_max = 6.0
persistence_gamma_step = 0.1
variance_threshold_min = 0.1
variance_threshold_max = 5.0
variance_threshold_step = 0.1
eviction_decay_min = 0.0
eviction_decay_max = 3.0
eviction_decay_step = 0.01
eviction_increment_min = 0.0
eviction_increment_max = 3.0
eviction_increment_step = 0.01
eviction_min_start_min = 0.0
eviction_min_start_max = 1.0
eviction_min_start_step = 0.01
eviction2_appearance_threshold_min = 1
eviction2_appearance_threshold_max = 30
eviction2_removal_threshold_min = 1
eviction2_removal_threshold_max = 60
weight_threshold_min = 0.0
weight_threshold_max = 1.0
weight_threshold_step = 0.01

# ============================================================================
# VIPRES Controls - Toggles
# ============================================================================
[vipres]
compute_color = true
segmentation_id_enabled = false
surface_flow_enabled = false
remesh_enabled = false
auto_recompute_mesh = false
remesh_poisson_smooth_normals = true

# VIPRES Controls - Sliders
surface_flow_radius = 50.0
surface_flow_threshold = 10.0
remesh_algorithm = 0  # 0=GriddedQuads, 1=NearestNeighbor, 2=Delaunay2D, 3=PoissonLike, 4=FCTM, 5=GeodesicTree, 6=GTree, 7=DensitySDF
remesh_max_distance = 1.0
remesh_max_neighbors = 20
remesh_projection_plane = 0  # 0=XY, 1=XZ, 2=YZ, 3=BestFit
remesh_delaunay_threshold = 1.0
remesh_poisson_radius = 1.0
remesh_poisson_depth = 8
remesh_poisson_density = 1.0
remesh_fctm_slice_thickness = 0.1
remesh_geodesic_k_neighbors = 6
remesh_geodesic_interior_bias = 0.5
segment_match_radius = 5.0

# Remesh slider limits
[vipres.limits]
max_distance_min = 1.0
max_distance_max = 100.0
max_neighbors_min = 5
max_neighbors_max = 50
delaunay_threshold_min = 1.0
delaunay_threshold_max = 100.0
poisson_radius_min = 1.0
poisson_radius_max = 100.0
poisson_depth_min = 4
poisson_depth_max = 12
poisson_density_min = 0.1
poisson_density_max = 5.0
fctm_slice_thickness_min = 0.01
fctm_slice_thickness_max = 10.0
fctm_max_clusters_min = 0
fctm_max_clusters_max = 100
geodesic_k_neighbors_min = 5
geodesic_k_neighbors_max = 15
geodesic_num_seeds_min = 0
geodesic_num_seeds_max = 100
geodesic_interior_bias_min = 0.0
geodesic_interior_bias_max = 1.0

# DensitySDF remesh settings
[vipres.density_sdf]
voxel_size = 0.5
smooth_radius = 0.5
iso_value = 0.3

# ============================================================================
# Object Settings
# ============================================================================
[objects]
size_default = 200.0
size_min = 1.0
size_max = 500.0

