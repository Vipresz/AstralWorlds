fps_column_width = 100.0
row_height_small = 18.0
row_height_medium = 20.0
row_height_standard = 25.0
row_height_button = 30.0
spacing_small = 3.0
spacing_medium = 5.0
spacing_large = 10.0

[ui_layout.camera_controls]
x = 10.0
width = 350.0
height = 400.0

[ui_layout.tof_controls]
x = 680.0
width = 300.0
height_base = 400.0
height_max = 800.0
height_per_camera = 25.0

[ui_layout.vipres_controls]
x = 370.0
width = 300.0
height_min = 200.0
