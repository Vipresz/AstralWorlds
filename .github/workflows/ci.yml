name: AstralWorlds CI

on:
  push:
    branches: [main, master, rgrigorii/menu]
  pull_request:
    branches: [main, master, rgrigorii/menu]

jobs:
  engine-tests-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Resolve RenderingEngine submodule commit
        id: rendering_engine
        shell: bash
        run: echo "sha=$(git ls-tree HEAD RenderingEngine | awk '{print $3}')" >> "$GITHUB_OUTPUT"

      - name: Checkout RenderingEngine
        uses: actions/checkout@v4
        with:
          repository: Vipresz/RenderingEngine
          path: RenderingEngine
          ref: ${{ steps.rendering_engine.outputs.sha }}
          token: ${{ secrets.REPO_PAT }}

      - name: Configure
        run: cmake -B build -DBUILD_GAME=OFF -DBUILD_SKELETON_EDITOR=OFF -DBUILD_ENGINE_TESTS=ON -DBUILD_ENGINE_PLATFORM=OFF

      - name: Build tests
        run: cmake --build build --config Release --target EngineTests --parallel

      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure --parallel

  engine-tests-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Resolve RenderingEngine submodule commit
        id: rendering_engine
        shell: bash
        run: echo "sha=$(git ls-tree HEAD RenderingEngine | awk '{print $3}')" >> "$GITHUB_OUTPUT"

      - name: Checkout RenderingEngine
        uses: actions/checkout@v4
        with:
          repository: Vipresz/RenderingEngine
          path: RenderingEngine
          ref: ${{ steps.rendering_engine.outputs.sha }}
          token: ${{ secrets.REPO_PAT }}

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_GAME=OFF -DBUILD_SKELETON_EDITOR=OFF -DBUILD_ENGINE_TESTS=ON -DBUILD_ENGINE_PLATFORM=OFF

      - name: Build tests
        run: cmake --build build --target EngineTests --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure --parallel
