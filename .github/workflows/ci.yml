name: AstralWorlds CI

# Game/server build validation only. Engine unit tests + coverage run in
# Vipresz/RenderingEngine (.github/workflows/ci.yml) — do not duplicate them here.
# Windows deps come from RenderingEngine/libs git submodules (+ GLEW win32 zip at configure).

on:
  push:
    branches: [main, master, rgrigorii/menu, feat/concurrent-player-scale]
  pull_request:
    branches: [main, master, rgrigorii/menu, feat/concurrent-player-scale]
  workflow_dispatch:

concurrency:
  group: astral-worlds-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-game-windows:
    # Vipresz org runner: actions-runner-vipresz (DESKTOP-HF590QG-vipresz). GPU + MSVC toolchain.
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Checkout RenderingEngine
        uses: ./.github/actions/checkout-rendering-engine
        with:
          token: ${{ secrets.REPO_PAT }}

      - name: Verify engine libs
        shell: pwsh
        run: |
          $glm = "RenderingEngine/libs/glm-1.0.2/glm/glm.hpp"
          $glfw = "RenderingEngine/libs/glfw-3.4/include/GLFW/glfw3.h"
          $assimp = "RenderingEngine/libs/assimp-6.0.2/include/assimp/Importer.hpp"
          foreach ($p in @($glm, $glfw, $assimp)) {
            if (-not (Test-Path $p)) { throw "Missing engine lib after submodule checkout: $p" }
            Write-Host "ok $p"
          }

      - name: Configure
        run: >
          cmake -B build
          -DBUILD_GAME=ON
          -DBUILD_GAME_TESTS=ON
          -DBUILD_SKELETON_EDITOR=OFF
          -DBUILD_ENGINE_TESTS=OFF

      - name: Build game
        run: cmake --build build --config Release --target Game GameServer GameTests --parallel

      - name: Verify binaries
        shell: pwsh
        run: |
          if (-not (Test-Path "build/bin/Release/game.exe")) { throw "game.exe missing" }
          if (-not (Test-Path "build/bin/Release/game_server.exe")) { throw "game_server.exe missing" }
          Write-Host "Game and server binaries built successfully."

      - name: Smoke test game.exe
        shell: pwsh
        working-directory: build/bin/Release
        run: |
          $proc = Start-Process -FilePath ".\game.exe" -ArgumentList "--smoke-test" -PassThru -Wait -NoNewWindow
          if ($proc.ExitCode -ne 0) { throw "game.exe --smoke-test failed with exit code $($proc.ExitCode)" }
          Write-Host "game.exe smoke test passed."

      - name: Game unit tests
        shell: pwsh
        working-directory: build/bin/Release
        run: |
          ctest --test-dir ../.. -C Release --output-on-failure --exclude-regex "GameNetworkE2ETest"
          if ($LASTEXITCODE -ne 0) { throw "Game unit tests failed with exit code $LASTEXITCODE" }

      - name: Game e2e tests
        shell: pwsh
        working-directory: build/bin/Release
        run: |
          ./GameTests.exe --gtest_filter=GameNetworkE2ETest.ConnectLoadCharacterAndMeasureMovementAck:GameNetworkE2ETest.BroadcastsChatBetweenPlayers:CharacterLoadE2ETest.*:ChatInputFocusTest.*:GameMenusManifestTest.*
          if ($LASTEXITCODE -ne 0) { throw "GameTests e2e failed with exit code $LASTEXITCODE" }

      - name: Upload Windows game artifact
        uses: actions/upload-artifact@v4
        with:
          name: astral-worlds-windows-${{ github.sha }}
          path: build/bin/Release/
          if-no-files-found: error

  build-game-server-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Checkout RenderingEngine
        uses: ./.github/actions/checkout-rendering-engine
        with:
          token: ${{ secrets.REPO_PAT }}

      - name: Install dependencies
        run: bash ./tools/ci/install_linux_game_deps.sh

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_GAME=ON
          -DBUILD_SKELETON_EDITOR=OFF
          -DBUILD_ENGINE_TESTS=OFF

      - name: Build game server
        run: cmake --build build --target GameServer --parallel

      - name: Verify binary
        run: test -x build/bin/game_server

      - name: Upload Linux server artifact
        uses: actions/upload-artifact@v4
        with:
          name: astral-worlds-linux-server-${{ github.sha }}
          path: build/bin/game_server
          if-no-files-found: error
