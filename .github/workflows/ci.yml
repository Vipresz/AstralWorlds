name: AstralWorlds CI

on:
  push:
    branches: [main, master, rgrigorii/menu]
  pull_request:
    branches: [main, master, rgrigorii/menu]
  workflow_dispatch:

concurrency:
  group: engine-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-tests-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Checkout RenderingEngine
        uses: ./.github/actions/checkout-rendering-engine
        with:
          token: ${{ secrets.REPO_PAT }}

      - name: Configure
        run: cmake -B build -DBUILD_GAME=OFF -DBUILD_SKELETON_EDITOR=OFF -DBUILD_ENGINE_TESTS=ON -DBUILD_ENGINE_PLATFORM=OFF

      - name: Build tests
        run: cmake --build build --config Release --target EngineTests --parallel

      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure --label-exclude aggregate

  engine-tests-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Checkout RenderingEngine
        uses: ./.github/actions/checkout-rendering-engine
        with:
          token: ${{ secrets.REPO_PAT }}

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_GAME=OFF -DBUILD_SKELETON_EDITOR=OFF -DBUILD_ENGINE_TESTS=ON -DBUILD_ENGINE_PLATFORM=OFF

      - name: Build tests
        run: cmake --build build --target EngineTests --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure -j 1 --label-exclude aggregate

  # Game + server build validation lives in game-ci.yml.
  # Release packaging lives in cd.yml (tag push v*).
