name: AstralWorlds Game CI

on:
  push:
    branches: [main, master, rgrigorii/menu]
  pull_request:
    branches: [main, master, rgrigorii/menu]
  workflow_dispatch:

concurrency:
  group: game-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-game-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Checkout RenderingEngine
        uses: ./.github/actions/checkout-rendering-engine
        with:
          token: ${{ secrets.REPO_PAT }}

      - name: Cache game_libs
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../game_libs
          key: game-libs-windows-${{ runner.os }}-v1

      - name: Bootstrap game_libs
        shell: pwsh
        run: ./tools/ci/bootstrap_game_libs.ps1

      - name: Configure
        run: >
          cmake -B build
          -DBUILD_GAME=ON
          -DBUILD_SKELETON_EDITOR=OFF
          -DBUILD_ENGINE_TESTS=OFF

      - name: Build game
        run: cmake --build build --config Release --target Game GameServer --parallel

      - name: Verify binaries
        shell: pwsh
        run: |
          if (-not (Test-Path "build/bin/Release/game.exe")) { throw "game.exe missing" }
          if (-not (Test-Path "build/bin/Release/game_server.exe")) { throw "game_server.exe missing" }
          Write-Host "Game and server binaries built successfully."

      - name: Upload Windows game artifact
        uses: actions/upload-artifact@v4
        with:
          name: astral-worlds-windows-${{ github.sha }}
          path: build/bin/Release/
          if-no-files-found: error

  build-game-server-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Checkout RenderingEngine
        uses: ./.github/actions/checkout-rendering-engine
        with:
          token: ${{ secrets.REPO_PAT }}

      - name: Install dependencies
        run: bash ./tools/ci/install_linux_game_deps.sh

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_GAME=ON
          -DBUILD_SKELETON_EDITOR=OFF
          -DBUILD_ENGINE_TESTS=OFF

      - name: Build game server
        run: cmake --build build --target GameServer --parallel

      - name: Verify binary
        run: test -x build/bin/game_server

      - name: Upload Linux server artifact
        uses: actions/upload-artifact@v4
        with:
          name: astral-worlds-linux-server-${{ github.sha }}
          path: build/bin/game_server
          if-no-files-found: error
