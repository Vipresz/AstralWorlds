name: AstralWorlds CD

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (for manual runs)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: astral-worlds-cd-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-windows:
    # Same self-hosted runner as AstralWorlds CI (actions-runner-vipresz).
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    steps:
      - name: Enable Git long paths
        shell: powershell
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Checkout RenderingEngine
        uses: ./.github/actions/checkout-rendering-engine
        with:
          token: ${{ secrets.REPO_PAT }}

      - name: Bootstrap RenderingEngine libs
        shell: powershell
        run: ./tools/ci/bootstrap_game_libs.ps1 -GameLibsPath RenderingEngine/libs

      - name: Verify engine libs
        shell: powershell
        run: |
          foreach ($p in @(
            "RenderingEngine/libs/glm-1.0.2/glm/glm.hpp",
            "RenderingEngine/libs/glfw-3.4/include/GLFW/glfw3.h",
            "RenderingEngine/libs/assimp-6.0.2/include/assimp/Importer.hpp"
          )) {
            if (-not (Test-Path $p)) { throw "Missing engine lib: $p" }
          }

      - name: Configure
        run: >
          cmake -B build
          -DBUILD_GAME=ON
          -DBUILD_SKELETON_EDITOR=OFF
          -DBUILD_ENGINE_TESTS=OFF

      - name: Build release binaries
        run: cmake --build build --config Release --target Game GameServer --parallel

      - name: Package Windows build
        shell: powershell
        run: ./tools/ci/package_windows_game.ps1 -BuildDir build -Config Release -OutputZip dist/astral-worlds-windows.zip

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: AstralWorlds ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: dist/astral-worlds-windows.zip
          generate_release_notes: true
