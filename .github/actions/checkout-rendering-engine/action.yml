name: Checkout RenderingEngine
description: Check out the RenderingEngine submodule commit referenced by the parent repo.

inputs:
  token:
    description: GitHub token with access to the private RenderingEngine repo.
    required: true

runs:
  using: composite
  steps:
    - name: Resolve RenderingEngine submodule commit
      id: rendering_engine
      shell: pwsh
      run: |
        $line = git ls-tree HEAD RenderingEngine
        if (-not $line) { throw "RenderingEngine submodule gitlink missing from HEAD" }
        $sha = ($line -split '\s+', 4)[2]
        if (-not $sha) { throw "Could not parse RenderingEngine commit from: $line" }
        "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8NoBOM

    - name: Checkout RenderingEngine
      uses: actions/checkout@v4
      with:
        repository: Vipresz/RenderingEngine
        path: RenderingEngine
        ref: ${{ steps.rendering_engine.outputs.sha }}
        token: ${{ inputs.token }}
        submodules: recursive
