name: Checkout RenderingEngine
description: Check out the RenderingEngine submodule commit referenced by the parent repo.

inputs:
  token:
    description: GitHub token with access to the private RenderingEngine repo.
    required: true

runs:
  using: composite
  steps:
    - name: Resolve RenderingEngine submodule commit
      id: rendering_engine
      shell: python
      run: |
        import os
        import subprocess

        line = subprocess.check_output(
            ["git", "ls-tree", "HEAD", "RenderingEngine"],
            text=True,
        ).strip()
        if not line:
            raise SystemExit("RenderingEngine submodule gitlink missing from HEAD")
        parts = line.split()
        if len(parts) < 3:
            raise SystemExit(f"Could not parse RenderingEngine commit from: {line}")
        sha = parts[2]
        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
            out.write(f"sha={sha}\n")

    - name: Checkout RenderingEngine
      uses: actions/checkout@v4
      with:
        repository: Vipresz/RenderingEngine
        path: RenderingEngine
        ref: ${{ steps.rendering_engine.outputs.sha }}
        token: ${{ inputs.token }}
        submodules: recursive
