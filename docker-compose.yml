services:
  # Build service - builds the entire project (engine + platform + game)
  build:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    volumes:
      - .:/workspace
      - ./build:/workspace/build
    command: >
      sh -c "
        mkdir -p build && cd build &&
        cmake .. -DCMAKE_BUILD_TYPE=Release &&
        cmake --build . --config Release -j$(nproc)
      "

  # Development service - interactive development environment
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/workspace
      - ./build:/workspace/build
    stdin_open: true
    tty: true
    command: /bin/bash

  # Run service - runs the built game executable
  run:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    # Uses the executable copied into the runtime image


